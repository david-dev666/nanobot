name: Windows gateway startup probe

on:
  push:
    branches: [diagnostics/windows-gateway-startup]

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTEST_ADDOPTS: "-o tmp_path_retention_policy=failed -p scripts.pytest_timing"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.9"
      - uses: astral-sh/setup-uv@v4
        with:
          version: "0.13.5"
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - name: Install the CI dependency set
        env:
          UV_EXCLUDE_NEWER: "2026-10-27T00:11:40Z"
        run: uv sync --all-extras --dev
      - name: Install channel dependencies
        env:
          UV_EXCLUDE_NEWER: "2026-10-27T00:11:40Z"
        run: uv run --no-sync python -m scripts.install_channel_dependencies --all-channels
      - name: Verify the serial native process group
        run: >-
          uv run --no-sync python -m pytest
          tests/tools/test_exec_platform.py tests/cli/test_wsl_browser.py
          tests/gateway/test_windows_shutdown.py
          --junitxml=.diagnostics/windows-startup/native-process.xml
          --timing-report=.diagnostics/windows-startup/native-process.json
          --durations=25 --durations-min=1.0
      - name: Recheck the observed compatibility timeouts
        run: >-
          uv run --no-sync python -m pytest -n 6 --dist loadfile
          tests/cron/test_cron_edit_deadlines.py::test_reschedule_during_execution_preserves_new_occurrence
          tests/agent/test_runtime_maintenance.py::test_dequeue_and_inline_dispatch_have_no_false_idle_gap
          --junitxml=.diagnostics/windows-startup/compatibility.xml
          --timing-report=.diagnostics/windows-startup/compatibility.json
          --durations=25 --durations-min=1.0
      - name: Save diagnostic results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-gateway-startup
          retention-days: 1
          include-hidden-files: true
          path: |
            .diagnostics/windows-startup/results.json
            .diagnostics/windows-startup/*.log
            .diagnostics/windows-startup/*.xml
            .diagnostics/windows-startup/**/gateway.log
