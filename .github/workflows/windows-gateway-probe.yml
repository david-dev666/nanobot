name: Windows gateway startup probe

on:
  push:
    branches: [diagnostics/windows-gateway-startup]

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      UV_EXCLUDE_NEWER: "2026-10-27T00:11:40Z"
      PYTEST_ADDOPTS: "-o tmp_path_retention_policy=failed -p scripts.pytest_timing"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.9"
      - uses: astral-sh/setup-uv@v4
        with:
          version: "0.13.5"
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - name: Install the CI dependency set
        run: uv sync --all-extras --dev
      - name: Install channel dependencies
        run: uv run --no-sync python -m scripts.install_channel_dependencies --all-channels
      - name: Repeat the unchanged isolated test
        run: uv run --no-sync python scripts/windows_gateway_probe.py
      - name: Reproduce the six-worker compatibility suite
        run: >-
          uv run --no-sync python -m pytest -n 6 --dist loadfile
          --ignore=tests/cli/test_commands.py --ignore=tests/cli/test_cli_input.py
          --ignore=tests/cli/test_desktop_target.py --ignore=tests/cli/test_desktop_target_entrypoints.py
          --ignore=tests/tools/test_exec_platform.py --ignore=tests/cli/test_wsl_browser.py
          --ignore=tests/test_install_scripts.py --ignore=tests/test_update_jobs.py
          --ignore=tests/test_update_profiles.py
          --junitxml=.diagnostics/windows-startup/compatibility.xml
          --timing-report=.diagnostics/windows-startup/compatibility.json
          --durations=25 --durations-min=1.0
      - name: Save diagnostic results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-gateway-startup
          retention-days: 1
          include-hidden-files: true
          path: |
            .diagnostics/windows-startup/results.json
            .diagnostics/windows-startup/*.log
            .diagnostics/windows-startup/*.xml
            .diagnostics/windows-startup/**/gateway.log
