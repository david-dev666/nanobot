name: Windows gateway startup probe

on:
  push:
    branches: [diagnostics/windows-gateway-startup]

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTEST_ADDOPTS: "-o tmp_path_retention_policy=failed -p scripts.pytest_timing"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.9"
      - uses: astral-sh/setup-uv@v4
        with:
          version: "0.13.5"
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - name: Install the CI dependency set
        env:
          UV_EXCLUDE_NEWER: "2026-10-27T00:11:40Z"
        run: uv sync --all-extras --dev
      - name: Install channel dependencies
        env:
          UV_EXCLUDE_NEWER: "2026-10-27T00:11:40Z"
        run: uv run --no-sync python -m scripts.install_channel_dependencies --all-channels
      - name: Run real gateway alongside storage and index tests
        run: >-
          uv run --no-sync python -m pytest -n 6 --dist loadfile
          tests/gateway/test_windows_shutdown.py
          tests/session/test_session_store.py tests/session/test_session_incremental.py
          tests/session/test_sqlite_storage.py tests/session/test_session_async.py
          tests/webui/test_prompt_index.py
          --junitxml=.diagnostics/windows-startup/mixed-storage.xml
          --timing-report=.diagnostics/windows-startup/mixed-storage.json
          --durations=15 --durations-min=1.0
      - name: Save diagnostic results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-gateway-startup
          retention-days: 1
          include-hidden-files: true
          path: |
            .diagnostics/windows-startup/*.json
            .diagnostics/windows-startup/*.log
            .diagnostics/windows-startup/*.xml
            .diagnostics/windows-startup/**/gateway.log
